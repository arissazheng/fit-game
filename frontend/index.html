<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lobby · Fit Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pixel-ui.css">
<script src="readme.js" defer></script>
<script src="pixel-ui.js" defer></script>
<script src="avatar.js"></script>
<script src="game.js"></script>
<script src="themes.js"></script>
<script src="room.js"></script>
<style>
  .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 28%) minmax(0, 1fr); gap: 12px; }
  .left { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; }
  .stage-win { min-height: 0; }
  .stage-win > .px-window__body { flex: 1; min-height: 0; }

  /* avatar builder */
  .swatches { display: flex; flex-wrap: wrap; gap: 4px; }
  .swatch { min-width: 0; min-height: 0; width: 34px; height: 34px; padding: 6px; }
  .swatch:active { padding: 7px 5px 5px 7px; }
  .swatch i { display: block; width: 100%; height: 100%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35); }
  .styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .styles .px-btn { min-width: 0; padding-left: 4px; padding-right: 4px; }
  .name-row { display: flex; gap: 6px; }
  .name-row .px-input { flex: 1; min-width: 0; }
  .name-error { color: #c00000; font-size: 15px; }
  .px-input.is-invalid { outline: 2px solid #c00000; outline-offset: 1px; }
  .shake { animation: shake 300ms steps(6); }
  @keyframes shake { 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }

  /* upload */
  .upload-drop { height: 96px; }
  .upload-drop .px-well__empty { font-size: 16px; }

  /* stage */
  .stage { flex: 1; min-height: 260px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 28px; }
  .floor { position: absolute; left: 8%; right: 8%; bottom: 44px; height: 10px; background: repeating-linear-gradient(90deg, #2a2a2a 0 16px, #1c1c1c 16px 32px); }
  #avatar { display: block; position: relative; z-index: 1; }
  .nametag { position: relative; z-index: 1; margin-top: 8px; padding: 2px 10px; background: var(--select); color: var(--select-text); font-size: 16px; }
  .players { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .seats { display: flex; flex-wrap: wrap; gap: 6px; }
  .seat { min-width: 0; min-height: 32px; padding: 4px 10px; font-size: 15px; }
  .seat.is-waiting { color: var(--text-disabled); cursor: default; }
  .seat--empty { padding: 4px 10px; min-height: 32px; display: inline-flex; align-items: center; box-shadow: var(--bevel-status); color: var(--text-disabled); font-size: 15px; }
  .check { color: #008000; font-weight: 700; }
  .seat[aria-pressed="true"] .check { color: #7fff7f; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .locked { opacity: 0.6; pointer-events: none; }

  @media (max-width: 860px) {
    .cols { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="px-desktop">
  <div class="px-desktop__icons">
    <button class="px-icon" data-readme title="How to play"><span style="font-size:36px">📄</span><span>readme</span></button>
    <button class="px-icon" aria-selected="true"><span style="font-size:36px">🏠</span><span>Lobby</span></button>
  </div>

  <div class="px-window px-window--main">
    <div class="px-titlebar">
      <span>FIT GAME v1.0</span>
      <span class="px-titlebar__controls"><button aria-label="Minimize">_</button><button aria-label="Maximize">□</button><button aria-label="Close">×</button></span>
    </div>
    <nav class="px-menubar"><button>File(F)</button><button>Edit(E)</button><button>View(V)</button><button>Help(H)</button></nav>

    <div class="px-window__body cols">
      <div class="left">
        <div class="px-window">
          <div class="px-titlebar"><span>Avatar.exe</span><span class="px-titlebar__controls"><button>_</button><button>□</button><button>×</button></span></div>
          <div class="px-window__body">
            <label class="px-label" for="avatar-name">Name</label>
            <div class="name-row">
              <input class="px-input" id="avatar-name" maxlength="16" placeholder="Your name" autocomplete="nickname">
            </div>
            <span class="name-error" id="name-error" role="alert" hidden>Type a name first, then press Ready</span>
            <span class="px-label">Skin</span>
            <div class="swatches" id="skin-swatches" role="group" aria-label="Skin tone"></div>
            <span class="px-label">Hair color</span>
            <div class="swatches" id="hair-swatches" role="group" aria-label="Hair color"></div>
            <span class="px-label">Hairstyle</span>
            <div class="styles" id="style-buttons" role="group" aria-label="Hairstyle"></div>
            <button class="px-btn" id="shuffle-btn" type="button" title="Pick a random skin tone, hair color, and hairstyle">🎲 Shuffle look</button>
          </div>
        </div>

        <div class="px-window">
          <div class="px-titlebar"><span>Upload.exe</span><span class="px-titlebar__controls"><button>_</button><button>□</button><button>×</button></span></div>
          <div class="px-window__body">
            <span class="px-label">Your photos <span id="photo-count">0 / 10</span></span>
            <div class="px-well px-dropzone upload-drop" id="photo-zone" data-preview="none" aria-label="Upload outfit photos">
              <input type="file" id="photo-input" accept="image/*" multiple>
              <div class="px-well__empty">🖼<br>Drag &amp; Drop<br>or Click</div>
            </div>
            <div class="thumbs" id="photo-thumbs"></div>
          </div>
        </div>
      </div>

      <div class="px-window stage-win">
        <div class="px-titlebar"><span id="lobby-title">Lobby.exe · Waiting for players</span><span class="px-titlebar__controls"><button>_</button><button>□</button><button>×</button></span></div>
        <div class="px-window__body">
          <div class="px-well stage" id="avatar-stage">
            <div class="floor" aria-hidden="true"></div>
            <canvas id="avatar" class="px-img" width="64" height="96" role="img" aria-label="Your avatar"></canvas>
            <div class="nametag" id="nametag">You</div>
          </div>
          <div class="players" aria-label="Players in this room">
            <span class="px-label">Players</span>
            <div class="seats" id="seats"></div>
            <button class="px-btn" id="invite-btn" type="button" title="Copy a link friends can open to join this room">Copy invite link</button>
          </div>
          <div class="actions">
            <button class="px-btn px-btn--wide" id="ready-btn" aria-pressed="false">Ready</button>
            <button class="px-btn px-btn--wide" id="start-btn" disabled>▶ Start game</button>
          </div>
        </div>
      </div>
    </div>

    <div class="px-statusbar"><span id="status-msg">Build your avatar and add up to 10 outfit photos, then press Start</span><span id="player-count">1 / 8 players</span><span id="room-cell">Room</span></div>
  </div>
</div>

<div class="px-taskbar">
  <button class="px-btn px-taskbar__task" data-readme title="How to play">📄 readme</button>
  <button class="px-btn px-taskbar__task" aria-pressed="true">🏠 Lobby.exe</button>
</div>

<script>
  var A = FIPAvatar;
  var look = FIP.store.getAvatar();
  var ready = false;
  var viewing = null;                     // player id shown on the stage (null = me)
  var canvas = document.getElementById('avatar');
  var stage = document.getElementById('avatar-stage');
  var nameInput = document.getElementById('avatar-name');
  var statusMsg = document.getElementById('status-msg');
  var readyBtn = document.getElementById('ready-btn');
  var startBtn = document.getElementById('start-btn');

  // ---------- room ----------
  var room = FIP.joinRoom({
    me: { name: look.name, look: look, ready: false },
    onChange: renderRoom,
    onStart: goToBuilder,
    onError: function (msg) { statusMsg.textContent = msg; }
  });

  // Put the room code in the address bar so the URL itself is the invite link.
  history.replaceState(null, '', FIP.withRoom('index.html'));
  document.getElementById('invite-btn').addEventListener('click', function () {
    var link = FIP.inviteLink(), btn = this;
    var done = function () { btn.textContent = 'Link copied!'; setTimeout(function () { btn.textContent = 'Copy invite link'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, function () { prompt('Copy this link:', link); });
    else prompt('Copy this link:', link);
  });

  function displayName(p) { return (p.name || '').trim() || 'Player'; }

  function renderRoom(players) {
    var seats = document.getElementById('seats');
    seats.innerHTML = '';
    if (viewing && !players.some(function (p) { return p.id === viewing && p.ready; })) viewing = null;

    players.forEach(function (p) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'px-btn seat';
      var label = displayName(p) + (p.isMe ? ' (you)' : '') + (p.isHost ? ' ★' : '');
      if (p.ready) {
        var check = document.createElement('span'); check.className = 'check'; check.textContent = '✓ ';
        btn.append(check, document.createTextNode(label));
      } else {
        btn.textContent = label;
      }
      var shown = viewing ? viewing === p.id : p.isMe;
      btn.setAttribute('aria-pressed', shown ? 'true' : 'false');
      if (p.connected === false) btn.title = displayName(p) + ' is reconnecting';
      if (!p.isMe && !p.ready) {
        btn.classList.add('is-waiting');
        btn.title = displayName(p) + ' is still customizing';
      } else {
        btn.title = p.isMe ? 'Show your avatar' : 'View ' + displayName(p) + "'s avatar";
        btn.addEventListener('click', function () { viewing = p.isMe ? null : p.id; renderRoom(room.players()); });
      }
      seats.appendChild(btn);
    });
    var empty = Math.max(0, 4 - players.length);   // always show at least 4 seats
    for (var i = 0; i < empty; i++) {
      var e = document.createElement('span'); e.className = 'seat--empty'; e.textContent = 'Waiting...'; seats.appendChild(e);
    }

    var readyCount = players.filter(function (p) { return p.ready; }).length;
    var allReady = readyCount === players.length;
    var meP = players.filter(function (p) { return p.isMe; })[0] || players[0];
    var host = players[0];
    document.getElementById('player-count').textContent =
      players.length + ' / ' + FIP.MAX_PLAYERS + ' players · ' + readyCount + ' ready';
    document.getElementById('room-cell').textContent = 'Room ' + room.roomId +
      (room.mode === 'server' ? ' · online' : room.mode === 'local' ? ' · this browser only' : ' · connecting');

    startBtn.disabled = !(meP.isHost && allReady);
    if (!meP.ready) statusMsg.textContent = 'Customize your avatar, then press Ready';
    else if (!allReady) statusMsg.textContent = 'Waiting for everyone to press Ready (' + readyCount + ' / ' + players.length + ')';
    else if (meP.isHost) statusMsg.textContent = 'Everyone is ready. Press Start game!';
    else statusMsg.textContent = 'Everyone is ready. Waiting for ' + displayName(host) + ' (host) to start';

    drawStage(players);
  }

  function drawStage(players) {
    var p = viewing && players.filter(function (x) { return x.id === viewing; })[0];
    var who = p ? p : { name: look.name, look: look, ready: ready, isMe: true };
    A.render(canvas, who.look);           // lobby = plain outfit, no accessories
    document.getElementById('nametag').textContent = (who.ready ? '✓ ' : '') + (displayName(who) === 'Player' && who.isMe ? 'You' : displayName(who));
    document.getElementById('lobby-title').textContent = p ? 'Lobby.exe · Viewing ' + displayName(p) : 'Lobby.exe · Your avatar';
  }

  // ---------- avatar builder ----------
  function changed() {
    FIP.store.setAvatar(look);
    room.update({ name: look.name, look: Object.assign({}, look) });
  }

  function makeChoices(container, items, key, render) {
    items.forEach(function (item) {
      var btn = document.createElement('button');
      btn.type = 'button';
      render(btn, item);
      btn.addEventListener('click', function () { look[key] = item.hex || item.id; sync(); viewing = null; changed(); });
      btn.dataset.value = item.hex || item.id;
      container.appendChild(btn);
    });
  }
  function sync() {
    [['skin-swatches', 'skin'], ['hair-swatches', 'hair'], ['style-buttons', 'style']].forEach(function (g) {
      document.querySelectorAll('#' + g[0] + ' button').forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.value === look[g[1]] ? 'true' : 'false');
      });
    });
    nameInput.value = look.name;
  }
  function swatch(btn, item) {
    btn.className = 'px-btn swatch';
    btn.title = item.name;
    btn.setAttribute('aria-label', item.name);
    var i = document.createElement('i'); i.style.background = item.hex; btn.appendChild(i);
  }

  makeChoices(document.getElementById('skin-swatches'), A.SKIN_TONES, 'skin', swatch);
  makeChoices(document.getElementById('hair-swatches'), A.HAIR_COLORS, 'hair', swatch);
  makeChoices(document.getElementById('style-buttons'), A.HAIRSTYLES, 'style', function (btn, item) {
    btn.className = 'px-btn'; btn.textContent = item.name;
  });

  nameInput.addEventListener('input', function () {
    look.name = nameInput.value;
    if (look.name.trim()) { document.getElementById('name-error').hidden = true; nameInput.classList.remove('is-invalid'); }
    changed();
  });
  document.getElementById('shuffle-btn').addEventListener('click', function () {
    var pick = function (list) { return list[Math.floor(Math.random() * list.length)]; };
    look.skin = pick(A.SKIN_TONES).hex; look.hair = pick(A.HAIR_COLORS).hex; look.style = pick(A.HAIRSTYLES).id;
    sync(); viewing = null; changed();
  });

  // ---------- ready ----------
  // Ready locks your avatar and shows a check next to your name. Press again to keep customizing.
  readyBtn.addEventListener('click', function () {
    if (!ready && !look.name.trim()) {
      // Make the missing name obvious: red outline, message under the field, and a little shake.
      document.getElementById('name-error').hidden = false;
      nameInput.classList.add('is-invalid');
      nameInput.classList.remove('shake'); void nameInput.offsetWidth; nameInput.classList.add('shake');
      statusMsg.textContent = 'Type a name first, then press Ready';
      nameInput.focus();
      return;
    }
    ready = !ready;
    readyBtn.setAttribute('aria-pressed', ready ? 'true' : 'false');
    readyBtn.textContent = ready ? '✓ Ready (click to edit)' : 'Ready';
    document.querySelector('.left .px-window').classList.toggle('locked', ready);
    nameInput.disabled = ready;
    room.update({ ready: ready });
  });

  new ResizeObserver(function () { A.fit(canvas, stage, 16, 90); }).observe(stage);

  FIP.mountUpload({
    zone: document.getElementById('photo-zone'),
    thumbs: document.getElementById('photo-thumbs'),
    count: document.getElementById('photo-count'),
    status: statusMsg
  });

  // ---------- start ----------
  // The host starts once everyone is ready. Every player gets the same theme and end time,
  // then moves to the outfit builder together. Test a short round with ?seconds=10.
  startBtn.addEventListener('click', function () {
    room.start({ seconds: Number(new URLSearchParams(location.search).get('seconds')) || 60 });
  });

  function goToBuilder(round) {
    FIP.store.setAvatar(look);
    try {
      sessionStorage.setItem('fip.round', JSON.stringify(round));
      sessionStorage.setItem('fip.roundStarted', String(Date.now()));
    } catch (e) { /* storage blocked */ }
    location.href = FIP.withRoom('demo.html');
  }

  sync();
  renderRoom(room.players());
</script>
</body>
</html>
