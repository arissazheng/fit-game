<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runway · Fit Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pixel-ui.css">
<script src="avatar.js"></script>
<script src="game.js"></script>
<script src="room.js"></script>
<script>
  // The runway only opens when the outfit builder's round ends; otherwise go back to the lobby.
  (function () {
    var ready = null;
    try { ready = sessionStorage.getItem('fip.runwayReady'); sessionStorage.removeItem('fip.runwayReady'); } catch (e) {}
    if (!ready) location.replace('index.html' + location.search);
  })();
</script>
<style>
  .view { flex: 1; min-height: 0; }
  .view > .px-window__body { flex: 1; min-height: 0; }
  .stage { flex: 1; min-height: 300px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 20px; }
  .floor { position: absolute; left: 6%; right: 6%; bottom: 64px; height: 10px; background: repeating-linear-gradient(90deg, #2a2a2a 0 16px, #1c1c1c 16px 32px); }
  .counter { position: absolute; top: 12px; left: 16px; color: var(--shadow); font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; }
  .walker { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .walker.is-walking { animation: walk-in 1.2s steps(12) both; }
  @keyframes walk-in {
    0% { transform: translateX(160%); }
    60% { transform: translateX(0) scaleX(1); }
    72% { transform: translateX(0) scaleX(0.1); }
    84%, 100% { transform: translateX(0) scaleX(1); }
  }
  #model { display: block; }
  .nametag { padding: 2px 12px; background: var(--select); color: var(--select-text); font-size: 18px; }
  .caption { color: var(--shadow); font-size: 14px; letter-spacing: 0.05em; text-align: center; max-width: 90%; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; z-index: 2; color: var(--light); text-align: center; font-size: 22px; letter-spacing: 0.08em; }
  .overlay big { display: block; font-size: 64px; margin-top: 8px; }

  .vote-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .stars { display: flex; gap: 4px; }
  .star { min-width: 52px; min-height: 44px; font-size: 24px; padding: 0; }
  .star:active { padding: 1px 0 0 1px; }
  .vote-note { font-size: 16px; }

  /* podium */
  .podium-stage { flex: 1; min-height: 320px; display: flex; align-items: flex-end; justify-content: center; gap: 12px; padding: 16px 16px 0; overflow: hidden; }
  .place { display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(220px, 30%); }
  .place canvas { display: block; }
  .place .who { padding: 2px 10px; background: var(--select); color: var(--select-text); font-size: 16px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .place .score { color: var(--bubble); font-size: 18px; }
  .block {
    width: 100%; display: grid; place-items: start center; padding-top: 8px;
    font-size: 40px; font-weight: 700; color: var(--text);
    box-shadow: var(--bevel-raised); animation: rise 600ms steps(6) both;
  }
  .place--1 .block { height: 150px; background: #e8c547; }
  .place--2 .block { height: 105px; background: #d6d9e0; }
  .place--3 .block { height: 72px; background: #d28c4a; }
  @keyframes rise { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .medal { font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--light); }
  .ranking { max-height: 160px; margin: 0; padding: 8px 12px; list-style: none; background: #fff; box-shadow: var(--bevel-sunken); }
  .ranking li { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; font-size: 16px; }
  .ranking li span:last-child { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="px-desktop">
  <div class="px-desktop__icons"></div>

  <div class="px-window px-window--main">
    <div class="px-titlebar">
      <span>FIT GAME v1.0</span>
      <span class="px-titlebar__controls"><button aria-label="Minimize">_</button><button aria-label="Maximize">□</button><button aria-label="Close">×</button></span>
    </div>
    <div class="px-window__body" style="flex:1; min-height:0">

      <!-- Runway: one player at a time, 10 seconds to vote -->
      <div class="px-window view" id="runway-view">
        <div class="px-titlebar"><span id="runway-title">Runway.exe</span><span class="px-titlebar__controls"><button>_</button><button>□</button><button>×</button></span></div>
        <div class="px-window__body">
          <div class="px-progress" id="vote-bar" style="--value:1"><i></i></div>
          <div class="px-well stage" id="stage">
            <div class="floor" aria-hidden="true"></div>
            <div class="counter" id="counter"></div>
            <div class="walker" id="walker" hidden>
              <canvas id="model" class="px-img" width="64" height="96" role="img" aria-label="Player on the runway"></canvas>
              <div class="nametag" id="model-name"></div>
              <div class="caption" id="model-outfit"></div>
            </div>
            <div class="overlay" id="overlay">Waiting for the show to start...</div>
          </div>
          <div class="vote-row">
            <span class="px-label">Rate this look</span>
            <div class="stars" id="stars" role="group" aria-label="Rate this look from 1 to 5 stars"></div>
            <span class="vote-note" id="vote-note"></span>
          </div>
        </div>
      </div>

      <!-- Podium: gold, silver, bronze -->
      <div class="px-window view" id="podium-view" hidden>
        <div class="px-titlebar"><span id="podium-title">Results.exe</span><span class="px-titlebar__controls"><button>_</button><button>□</button><button>×</button></span></div>
        <div class="px-window__body">
          <div class="px-well podium-stage" id="podium"></div>
          <span class="px-label">Ranking</span>
          <ol class="ranking px-scroll" id="ranking"></ol>
          <a class="px-btn px-btn--wide" href="index.html" id="lobby-link" style="display:grid;place-items:center;text-decoration:none">Back to lobby</a>
        </div>
      </div>
    </div>
    <div class="px-statusbar"><span id="status-msg">Loading the runway...</span><span id="vote-count">0 / 0 voted</span><span id="time-cell">0:10</span></div>
  </div>
</div>

<div class="px-taskbar">
  <button class="px-btn">▤ Start</button>
  <button class="px-btn px-taskbar__task" aria-pressed="true">👠 Runway.exe</button>
  <span class="px-taskbar__tray">🔈 17:14</span>
</div>

<script>
  var VOTE_SECONDS = 10;
  var $ = function (id) { return document.getElementById(id); };
  var me = FIP.store.getAvatar();
  var myId = null;
  try { myId = sessionStorage.getItem('fip.playerId'); } catch (e) {}
  $('lobby-link').href = FIP.withRoom('index.html');

  var current = null;      // the 'show' message for the player on the runway now
  var myVote = 0;
  var deadline = 0, introAt = 0;

  function outfitText(o) {
    o = o || {};
    return [o.dress, o.top, o.bottom].filter(Boolean).concat(o.accessories || []).join(' · ') || 'plain fit';
  }

  // ---------- stars ----------
  var starBtns = [];
  for (var i = 1; i <= 5; i++) (function (n) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'px-btn star'; b.textContent = '★';
    b.setAttribute('aria-label', n + (n === 1 ? ' star' : ' stars'));
    b.addEventListener('click', function () { vote(n); });
    $('stars').appendChild(b); starBtns.push(b);
  })(i);
  function paintStars() {
    starBtns.forEach(function (b, i) { b.setAttribute('aria-pressed', i < myVote ? 'true' : 'false'); });
  }
  function setStarsEnabled(on) { starBtns.forEach(function (b) { b.disabled = !on; }); }

  function vote(n) {
    if (!current || !current.canVote || Date.now() > deadline) return;
    myVote = n; paintStars();                       // first n stars turn blue right away
    $('vote-note').textContent = 'Saving your ' + n + '★ vote...';
    if (game.online) game.send({ type: 'vote', modelId: current.model.id, stars: n });
    else onVoted({ modelId: current.model.id, stars: n });
  }
  function onVoted(m) {
    if (!current || m.modelId !== current.model.id) return;
    myVote = m.stars; paintStars();
    var whose = current.model.id === myId ? 'your own look' : current.model.name;
    $('vote-note').textContent = 'Vote saved ✓ You gave ' + whose + ' ' + m.stars + '★ · you can change it until time runs out';
    if (!game.online) soloStars = m.stars;
  }

  // ---------- runway ----------
  function onIntro(m) {
    introAt = m.startsAt;
    $('runway-title').textContent = 'Runway.exe · THEME: ' + m.theme;
    $('counter').textContent = m.total + (m.total === 1 ? ' look' : ' looks') + ' tonight';
    $('walker').hidden = true; $('overlay').hidden = false;
    setStarsEnabled(false);
    $('status-msg').textContent = 'Get ready! Rate each look from 1 to 5 stars';
  }

  function onShow(m) {
    var isNew = !current || current.model.id !== m.model.id;
    current = m; myVote = m.myVote || 0; deadline = m.endsAt; introAt = 0;
    $('runway-title').textContent = 'Runway.exe · THEME: ' + m.theme;
    $('overlay').hidden = true;
    $('counter').textContent = 'Look ' + (m.index + 1) + ' / ' + m.total;
    FIPAvatar.render($('model'), m.model.look, m.model.outfit);
    $('model-name').textContent = m.model.name + (m.model.id === myId ? ' (you)' : '');
    $('model-outfit').textContent = outfitText(m.model.outfit);
    var w = $('walker');
    w.hidden = false;
    if (isNew) { w.classList.remove('is-walking'); void w.offsetWidth; w.classList.add('is-walking'); }
    fitModel();
    var mine = m.model.id === myId;
    setStarsEnabled(!!m.canVote);
    paintStars();
    if (myVote) $('vote-note').textContent = 'Vote saved ✓ You gave ' + (mine ? 'your own look' : m.model.name) + ' ' + myVote + '★';
    else if (mine && m.canVote) $('vote-note').textContent = "Solo round: rate your own look";
    else if (mine) $('vote-note').textContent = 'This is your look! Everyone else is voting.';
    else $('vote-note').textContent = 'Tap the stars to vote';
    $('status-msg').textContent = mine ? 'Strike a pose!' : 'Rate ' + m.model.name + "'s look";
    showVotes(m.votes, m.eligible);
  }
  function showVotes(v, e) { $('vote-count').textContent = e ? v + ' / ' + e + ' voted' : 'No voters'; }

  function fitModel() { FIPAvatar.fit($('model'), $('stage'), 32, 110); }
  new ResizeObserver(fitModel).observe($('stage'));

  // vote timer + intro countdown
  setInterval(function () {
    var now = Date.now();
    if (introAt) {
      var s = Math.max(0, Math.ceil((introAt - now) / 1000));
      $('overlay').innerHTML = 'The show starts in<big>' + (s || 'NOW') + '</big>';
      return;
    }
    if (!current) return;
    var leftMs = Math.max(0, deadline - now), left = Math.min(VOTE_SECONDS, Math.ceil(leftMs / 1000));
    $('time-cell').textContent = '0:' + String(left).padStart(2, '0');
    $('vote-bar').style.setProperty('--value', Math.min(1, leftMs / (VOTE_SECONDS * 1000)));
    $('vote-bar').classList.toggle('is-danger', left <= 3);
    if (leftMs === 0) setStarsEnabled(false);
  }, 200);

  // ---------- podium ----------
  function onPodium(m) {
    current = null; introAt = 0;
    $('runway-view').hidden = true;
    $('podium-view').hidden = false;
    $('podium-title').textContent = 'Results.exe · THEME: ' + m.theme;
    $('time-cell').textContent = 'Final';
    $('vote-count').textContent = m.results.length + (m.results.length === 1 ? ' player' : ' players');
    var pod = $('podium'); pod.innerHTML = '';
    var medals = ['Gold', 'Silver', 'Bronze'];
    [1, 0, 2].forEach(function (i) {          // silver, gold, bronze from left to right
      var r = m.results[i];
      if (!r) return;
      var col = document.createElement('div');
      col.className = 'place place--' + Math.min(r.place, 3);   // ties share a medal
      var c = document.createElement('canvas'); c.className = 'px-img';
      FIPAvatar.render(c, r.look, r.outfit);
      var room = pod.clientHeight;      // gold is bigger when the stage has room for it
      var scale = r.place === 1 && i === 0 ? (room > 600 ? 3 : 2) : (room > 380 ? 2 : 1);
      c.style.width = 64 * scale + 'px'; c.style.height = 96 * scale + 'px';
      var medal = document.createElement('div'); medal.className = 'medal'; medal.textContent = medals[Math.min(r.place, 3) - 1];
      var who = document.createElement('div'); who.className = 'who'; who.textContent = r.name + (r.id === myId ? ' (you)' : '');
      var score = document.createElement('div'); score.className = 'score';
      score.textContent = '★ ' + r.stars + (r.stars === 1 ? ' star' : ' stars');
      var block = document.createElement('div'); block.className = 'block'; block.textContent = r.place;
      col.append(medal, c, who, score, block);
      pod.appendChild(col);
    });
    var list = $('ranking'); list.innerHTML = '';
    m.results.forEach(function (r) {
      var li = document.createElement('li');
      var a = document.createElement('span'); a.textContent = r.place + '. ' + r.name + (r.id === myId ? ' (you)' : '');
      var b = document.createElement('span'); b.textContent = '★ ' + r.stars + ' · ' + r.votes + (r.votes === 1 ? ' vote' : ' votes');
      li.append(a, b); list.appendChild(li);
    });
    var mine = m.results.filter(function (r) { return r.id === myId; })[0];
    $('status-msg').textContent = mine ? 'You placed #' + mine.place + ' with ' + mine.stars + '★' : 'Final results';
  }

  // ---------- connection ----------
  var game = FIP.connectGame({
    onOpen: function () { try { myId = sessionStorage.getItem('fip.playerId'); } catch (e) {} },
    onIntro: onIntro,
    onShow: onShow,
    onVotes: function (m) { if (current && m.modelId === current.model.id) showVotes(m.votes, m.eligible); },
    onVoted: onVoted,
    onPodium: onPodium,
    onOffline: playSolo
  });

  // Without a game server you're the only player: rate your own look for 10 seconds, then the podium.
  var soloStars = 0;
  function playSolo() {
    var outfit = null;
    try { outfit = JSON.parse(localStorage.getItem('fip.outfit')); } catch (e) {}
    if (!outfit) { $('status-msg').textContent = 'No saved outfit found'; return; }
    myId = 'me';
    var model = { id: 'me', name: me.name || 'You', look: me, outfit: outfit };
    onIntro({ startsAt: Date.now() + 2000, total: 1, theme: outfit.theme });
    setTimeout(function () {
      onShow({ index: 0, total: 1, model: model, theme: outfit.theme, endsAt: Date.now() + VOTE_SECONDS * 1000,
               votes: 0, eligible: 1, canVote: true, myVote: 0 });
    }, 2000);
    setTimeout(function () {
      onPodium({ theme: outfit.theme, results: [Object.assign({ stars: soloStars, votes: soloStars ? 1 : 0, place: 1 }, model)] });
    }, 2000 + VOTE_SECONDS * 1000 + 300);
  }
</script>
</body>
</html>
