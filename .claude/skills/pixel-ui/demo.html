  // opening or refreshing it directly sends you back to the lobby.
  (function () {
    var started = null;
    try { started = sessionStorage.getItem('fip.roundStarted'); sessionStorage.removeItem('fip.roundStarted'); } catch (e) {}
    if (!started) location.replace('index.html' + location.search);

  .stage { flex: 1; min-height: 240px; overflow: hidden; }
  #avatar { display: block; }
  .avatar-caption { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; color: var(--shadow); font-size: 15px; letter-spacing: 0.06em; }

  .upload-drop .px-well__empty { font-size: 16px; }
  @media (max-width: 860px) {

<script>
  // A round lasts from Start (in the lobby, index.html) to the podium. Pick one random theme per round.
  // In this prototype, arriving on this page starts a round.
  // In the real game, the host calls startRound() on Start and broadcasts the theme to every player.
  // The lobby's host picks the theme and end time and sends the same round to every player.
  var lobbyRound = null;
  try { lobbyRound = JSON.parse(sessionStorage.getItem('fip.round')); } catch (e) {}
  function startRound() {
    var t = lobbyRound || FIP.pickTheme();
    document.getElementById('theme-title').textContent = 'THEME: ' + t.theme;
    document.title = t.theme + ' · Fashion in Pixels';
    return t;
  }
  var round = startRound();

  // Connection to the game server (if this page is served by it). Outfits are sent on lock-in and at 0:00.
  var game = FIP.connectGame({
    onStart: function (r) {      // the server's round wins if this page somehow missed it
      if (!lobbyRound) { lobbyRound = r; round = startRound(); endsAt = r.endsAt; ROUND_SECONDS = r.seconds; }
    }
  });

  // ---------- Closet: pick items ----------
  // One item per category (Acc allows several). A dress replaces top + bottom, and vice versa.
  var locked = false;
  document.querySelector('.closet-tabs').addEventListener('click', function (e) {
    var slot = e.target.closest('.px-slot');
    if (!slot || locked) return;
    var panel = slot.closest('[role="tabpanel"]');
    var on = slot.getAttribute('aria-selected') !== 'true';
    if (panel.id !== 'panel-acc') {
      panel.querySelectorAll('.px-slot').forEach(function (s) { s.setAttribute('aria-selected', 'false'); });
      var clear = panel.id === 'panel-dresses' ? ['panel-tops', 'panel-bottoms']
                : (panel.id === 'panel-tops' || panel.id === 'panel-bottoms') ? ['panel-dresses'] : [];
      if (on) clear.forEach(function (id) {
        document.querySelectorAll('#' + id + ' .px-slot').forEach(function (s) { s.setAttribute('aria-selected', 'false'); });
      });
    }
    slot.setAttribute('aria-selected', on ? 'true' : 'false');
    drawAvatar();
  });

  function currentOutfit() {
    var pick = function (id) {
      return Array.prototype.map.call(document.querySelectorAll('#' + id + ' .px-slot[aria-selected="true"]'),
        function (s) { return s.title; });
    };
    return {
      theme: round.theme,
      top: pick('panel-tops')[0] || null,
      bottom: pick('panel-bottoms')[0] || null,
      dress: pick('panel-dresses')[0] || null,
      accessories: pick('panel-acc'),
      savedAt: new Date().toISOString()
    };
  }

  function saveOutfit() {
    var outfit = currentOutfit();
    try { localStorage.setItem('fip.outfit', JSON.stringify(outfit)); } catch (err) { /* storage blocked */ }
    game.send({ type: 'outfit', outfit: outfit });   // the server shares it with everyone for the runway
    return outfit;
  }

  document.getElementById('lock-btn').addEventListener('click', function () {
    saveOutfit();
    locked = true;
    this.disabled = true;
    this.textContent = 'Outfit locked in. Waiting for the timer';
    document.getElementById('status-msg').textContent = 'Outfit saved';
  });

  // ---------- Avatar ----------
  // The avatar built in the lobby (skin, hair, hairstyle), dressed live from closet picks.
  // Shared renderer: avatar.js. Clothes are placeholder pixel shapes until extracted sprites exist.
  var avatar = document.getElementById('avatar');
  var stage = document.getElementById('avatar-stage');
  var look = FIP.store.getAvatar();
  function drawAvatar() {
    var o = currentOutfit();
    FIPAvatar.render(avatar, look, o);
    var parts = [o.dress, o.top, o.bottom].filter(Boolean).concat(o.accessories);
    document.getElementById('avatar-caption').textContent = (look.name ? look.name + ': ' : '') +
      (parts.length ? parts.join(' · ') : 'plain fit');
  }
  new ResizeObserver(function () { FIPAvatar.fit(avatar, stage, 16, 56); }).observe(stage);
  drawAvatar();

  // ---------- Round timer ----------
  // 60s from when players enter this page (the lobby's Start button will send them here).
  // Counting down to a fixed end time keeps every player in sync; in multiplayer the server
  // should broadcast that end time with the theme. Test with a shorter round: demo.html?seconds=10
  var ROUND_SECONDS = (lobbyRound && lobbyRound.seconds) || Number(new URLSearchParams(location.search).get('seconds')) || 60;
  var endsAt = (lobbyRound && lobbyRound.endsAt) || Date.now() + ROUND_SECONDS * 1000;
  var bar = document.getElementById('timer-bar');
  var text = document.getElementById('timer-text');

  function tick() {
    var left = Math.min(ROUND_SECONDS, Math.max(0, Math.ceil((endsAt - Date.now()) / 1000)));
    text.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    bar.style.setProperty('--value', left / ROUND_SECONDS);
    bar.classList.toggle('is-danger', left <= 10);
    if (left === 0) {
      clearInterval(timer);
      saveOutfit();
      locked = true;
      document.getElementById('status-msg').textContent = "Time's up! Outfit saved. Heading to the runway...";
      try { sessionStorage.setItem('fip.runwayReady', String(Date.now())); } catch (e) { /* storage blocked */ }
      setTimeout(function () { location.href = FIP.withRoom('runway.html'); }, 1500);
    }
  }
  var timer = setInterval(tick, 250);
  tick();


  // Upload.exe: same photos as the lobby (saved in this browser), up to 10
  FIP.mountUpload({
    zone: document.getElementById('photo-zone'),
    thumbs: document.getElementById('photo-thumbs'),
    count: document.getElementById('photo-count'),
    status: document.getElementById('status-msg')
  });
</script>
