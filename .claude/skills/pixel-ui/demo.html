<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel UI Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pixel-ui.css">
<script src="pixel-ui.js" defer></script>
<script src="themes.js"></script>
<style>
  .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 28%) minmax(0, 1fr); gap: 12px; }
  .left { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; }
  .stage-win { min-height: 0; }
  .stage-win > .px-window__body { flex: 1; min-height: 0; }
  .stage { flex: 1; min-height: 240px; overflow: hidden; }
  #avatar { display: block; }
  .avatar-caption { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; color: var(--shadow); font-size: 15px; letter-spacing: 0.06em; }
  .px-tab { padding-left: 10px; padding-right: 10px; }
  .closet-win { flex: 1 1 0; min-height: 360px; }
  .closet-win > .px-window__body { flex: 1; min-height: 0; }
  .closet-tabs { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .closet-tabs .px-tabpanel { flex: 1; min-height: 0; }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .px-slot .item { font-size: 32px; line-height: 1; } /* placeholder sprites until real pixel items exist */
  .upload-drop { height: 96px; }
  .upload-drop .px-well__empty { font-size: 16px; }
  .thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .thumbs:empty { display: none; }
  .thumbs .px-slot { padding: 3px; }
  .thumbs img { object-fit: cover; }
  @media (max-width: 860px) {
    .cols { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="px-desktop">
  <div class="px-desktop__icons">
      <button class="px-icon"><span style="font-size:36px">📄</span><span>readme</span></button>
      <button class="px-icon" aria-selected="true"><span style="font-size:36px">👗</span><span>Closet</span></button>
      <button class="px-icon"><span style="font-size:36px">🛍️</span><span>Market</span></button>
  </div>

    <div class="px-window px-window--main">

          <div class="px-window">
            <div class="px-titlebar"><span>Upload.exe</span><span class="px-titlebar__controls"><button>_</button><button>□</button><button>×</button></span></div>
            <div class="px-window__body">
              <span class="px-label">Your photos <span id="photo-count">0 / 10</span></span>

        <div class="px-window stage-win">
          <div class="px-titlebar"><span id="theme-title">THEME: Y2K Pop Star</span><span class="px-titlebar__controls"><button>_</button><button>□</button><button>×</button></span></div>
          <div class="px-window__body">
            <div class="px-progress" id="timer-bar" style="--value:1"><i></i></div>
            <div class="px-well stage" id="avatar-stage">
              <canvas id="avatar" class="px-img" width="64" height="128" role="img" aria-label="Your avatar"></canvas>
              <div class="avatar-caption" id="avatar-caption">Default fit</div>

</div>

<div class="px-taskbar">
  <button class="px-btn">▤ Start</button>
  <button class="px-btn px-taskbar__task">📄 readme</button>
  <button class="px-btn px-taskbar__task" aria-pressed="true">👗 Closet.exe</button>
  <span class="px-taskbar__tray">🔈 17:13</span>
</div>
<script>
  // A round lasts from Start to the podium. Pick one random theme per round.
  // In the demo, loading the page starts a round (refresh = new round).
  // In the real game, the host calls startRound() on Start and broadcasts the theme to every player.
  function startRound() {
    var t = FIP.pickTheme();
    document.getElementById('theme-title').textContent = 'THEME: ' + t.theme;
    document.title = t.theme + ' · Fashion in Pixels';
    return t;
  }
  var round = startRound();

  // ---------- Closet: pick items ----------
  // One item per category (Acc allows several). A dress replaces top + bottom, and vice versa.
  var locked = false;
  document.querySelector('.closet-tabs').addEventListener('click', function (e) {
    var slot = e.target.closest('.px-slot');
    if (!slot || locked) return;
    var panel = slot.closest('[role="tabpanel"]');
    var on = slot.getAttribute('aria-selected') !== 'true';
    if (panel.id !== 'panel-acc') {
      panel.querySelectorAll('.px-slot').forEach(function (s) { s.setAttribute('aria-selected', 'false'); });
      var clear = panel.id === 'panel-dresses' ? ['panel-tops', 'panel-bottoms']
                : (panel.id === 'panel-tops' || panel.id === 'panel-bottoms') ? ['panel-dresses'] : [];
      if (on) clear.forEach(function (id) {
        document.querySelectorAll('#' + id + ' .px-slot').forEach(function (s) { s.setAttribute('aria-selected', 'false'); });
      });
    }
    slot.setAttribute('aria-selected', on ? 'true' : 'false');
    drawAvatar();
  });

  function currentOutfit() {
    var pick = function (id) {
      return Array.prototype.map.call(document.querySelectorAll('#' + id + ' .px-slot[aria-selected="true"]'),
        function (s) { return s.title; });
    };
    return {
      theme: round.theme,
      top: pick('panel-tops')[0] || null,
      bottom: pick('panel-bottoms')[0] || null,
      dress: pick('panel-dresses')[0] || null,
      accessories: pick('panel-acc'),
      savedAt: new Date().toISOString()
    };
  }

  function saveOutfit() {
    var outfit = currentOutfit();
    try { localStorage.setItem('fip.outfit', JSON.stringify(outfit)); } catch (err) { /* storage blocked */ }
    // Real game: send `outfit` to the server here so the runway can show everyone's look.
    return outfit;
  }

  document.getElementById('lock-btn').addEventListener('click', function () {
    saveOutfit();
    locked = true;
    this.disabled = true;
    this.textContent = 'Outfit locked in. Waiting for the timer';
    document.getElementById('status-msg').textContent = 'Outfit saved';
  });

  // ---------- Avatar ----------
  // Placeholder avatar on the 64x128 spec canvas (see the avatar slot spec). Clothes are drawn as
  // simple pixel shapes colored from the item name, until real extracted sprites replace them:
  // then each item becomes a full 64x128 transparent PNG stacked in layer order
  // body -> bottom -> shoes -> top -> dress -> outerwear -> neck -> bag -> face -> head.
  var avatar = document.getElementById('avatar');
  var ctx = avatar.getContext('2d');
  var SKIN = '#e8b896', HAIR = '#2b1b14', INK = '#1a1a1a';
  var COLORS = [['black', '#1b1b1f'], ['white', '#f2f2f2'], ['pink', '#f28cb8'], ['navy', '#1f2f6b'],
    ['denim', '#4a6fa5'], ['jean', '#4a6fa5'], ['blue', '#4a90d9'], ['gray', '#8a8d93'], ['lilac', '#b9a3e3'],
    ['red', '#d23b3b'], ['plaid', '#a23b3b'], ['leather', '#3a2a22'], ['linen', '#e6dcc4'], ['cargo', '#6b6b47'],
    ['trench', '#b8955e'], ['sun', '#f5c542'], ['silk', '#d9a6c9'], ['maxi', '#7fbf9a'], ['kimono', '#e98fa8'],
    ['sari', '#2fae9b'], ['khaki', '#b8a06a'], ['band', '#2a2a2a'], ['puffer', '#e0563a'], ['lace', '#f4efe6']];
  function colorFor(name) {
    var n = name.toLowerCase();
    for (var i = 0; i < COLORS.length; i++) if (n.indexOf(COLORS[i][0]) !== -1) return COLORS[i][1];
    var h = 0; for (var j = 0; j < n.length; j++) h = (h * 31 + n.charCodeAt(j)) % 360;
    return 'hsl(' + h + ', 55%, 55%)';
  }
  function px(c, x, y, w, h) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
  function has(name, words) { return words.some(function (w) { return name.toLowerCase().indexOf(w) !== -1; }); }

  function drawAvatar() {
    var o = currentOutfit();
    ctx.clearRect(0, 0, 64, 128);
    // body
    px(SKIN, 24, 6, 16, 18);                                   // head
    px(HAIR, 22, 2, 20, 7); px(HAIR, 22, 6, 3, 18); px(HAIR, 39, 6, 3, 18);
    px(INK, 28, 14, 2, 2); px(INK, 34, 14, 2, 2); px('#c0605a', 31, 19, 2, 1);
    px(SKIN, 29, 24, 6, 4);                                    // neck
    px(SKIN, 22, 28, 20, 34);                                  // torso
    px(SKIN, 16, 30, 6, 30); px(SKIN, 42, 30, 6, 30);          // arms
    px(SKIN, 16, 60, 6, 5); px(SKIN, 42, 60, 6, 5);            // hands
    px(SKIN, 24, 62, 7, 48); px(SKIN, 33, 62, 7, 48);          // legs
    px('#3b3b44', 22, 110, 9, 6); px('#3b3b44', 33, 110, 9, 6); // shoes
    if (o.dress) {
      var d = colorFor(o.dress);
      px(d, 22, 28, 20, 4); px(SKIN, 22, 28, 3, 2); px(SKIN, 39, 28, 3, 2);
      for (var r = 0; r < 64; r++) { var grow = Math.floor(r / 10); px(d, 22 - grow, 32 + r, 20 + grow * 2, 1); }
    } else {
      if (o.bottom) {
        var b = colorFor(o.bottom);
        if (has(o.bottom, ['short', 'cutoff', 'skort'])) px(b, 23, 60, 18, 20);
        else { px(b, 23, 60, 18, 6); px(b, 23, 66, 8, 44); px(b, 33, 66, 8, 44); }
      } else {
        px('#111114', 23, 60, 18, 18);                         // default black shorts
      }
      if (o.top) {
        var t = colorFor(o.top);
        px(t, 21, 28, 22, 36);
        if (!has(o.top, ['tank', 'cami', 'halter', 'corset'])) {
          var longSleeve = has(o.top, ['jacket', 'coat', 'blazer', 'cardigan', 'hoodie', 'flannel', 'shirt', 'overshirt', 'button']);
          px(t, 16, 30, 6, longSleeve ? 28 : 12); px(t, 42, 30, 6, longSleeve ? 28 : 12);
        }
        if (has(o.top, ['jacket', 'coat', 'blazer', 'cardigan'])) px('#00000033', 31, 28, 2, 36);
      } else {
        px('#111114', 23, 30, 18, 32); px('#111114', 25, 28, 3, 2); px('#111114', 36, 28, 3, 2); // default black tank
      }
    }
    o.accessories.forEach(function (a) {
      var c = colorFor(a);
      if (has(a, ['hat', 'cap'])) { px(c, 20, 0, 24, 6); if (has(a, ['sun'])) px(c, 16, 5, 32, 2); }
      else if (has(a, ['glasses'])) { px(INK, 26, 13, 5, 4); px(INK, 33, 13, 5, 4); px(INK, 31, 14, 2, 1); }
      else if (has(a, ['scarf'])) { px(c, 25, 24, 14, 5); px(c, 34, 29, 4, 10); }
      else if (has(a, ['necklace'])) { px(c, 27, 28, 10, 1); px(c, 31, 29, 2, 2); }
      else if (has(a, ['bag', 'purse', 'backpack'])) { px(c, 47, 30, 1, 22); px(c, 45, 52, 10, 10); }
      else if (has(a, ['watch', 'ring'])) { px(c, 42, 57, 6, 2); }
      else if (has(a, ['bow'])) { px(c, 37, 1, 8, 4); }
      else { px(c, 46, 54, 6, 6); }
    });
    var parts = [o.dress, o.top, o.bottom].filter(Boolean).concat(o.accessories);
    document.getElementById('avatar-caption').textContent = parts.length ? parts.join(' · ') : 'Default fit: black tank + shorts';
  }

  // Scale the avatar by whole numbers only so pixels stay square.
  var stage = document.getElementById('avatar-stage');
  function fitAvatar() {
    var scale = Math.max(1, Math.floor(Math.min((stage.clientHeight - 56) / 128, (stage.clientWidth - 16) / 64)));
    avatar.style.width = 64 * scale + 'px';
    avatar.style.height = 128 * scale + 'px';
  }
  new ResizeObserver(fitAvatar).observe(stage);
  fitAvatar();
  drawAvatar();

  // ---------- Round timer ----------
  // 60s from when players enter this page (the lobby's Start button will send them here).
  // Counting down to a fixed end time keeps every player in sync; in multiplayer the server
  // should broadcast that end time with the theme. Test with a shorter round: demo.html?seconds=10
  var ROUND_SECONDS = Number(new URLSearchParams(location.search).get('seconds')) || 60;
  var endsAt = Date.now() + ROUND_SECONDS * 1000;
  var bar = document.getElementById('timer-bar');
  var text = document.getElementById('timer-text');

  function tick() {
    var left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
    text.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    bar.style.setProperty('--value', left / ROUND_SECONDS);
    bar.classList.toggle('is-danger', left <= 10);
    if (left === 0) {
      clearInterval(timer);
      saveOutfit();
      locked = true;
      document.getElementById('status-msg').textContent = "Time's up! Outfit saved. Heading to the runway...";
      setTimeout(function () { location.href = 'runway.html'; }, 1500);
    }
  }
  var timer = setInterval(tick, 250);
  tick();


  // Upload.exe: keep up to 10 photos and show them as thumbnails
  var photos = [];
  document.getElementById('photo-zone').addEventListener('px-files', function (e) {
    var room = 10 - photos.length;
    var added = e.detail.files.slice(0, room);
    added.forEach(function (file) {
      photos.push(file);
      var slot = document.createElement('div');
      slot.className = 'px-slot';
      slot.title = file.name;
      var img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.alt = file.name;
      slot.appendChild(img);
      document.getElementById('photo-thumbs').appendChild(slot);
    });
    document.getElementById('photo-count').textContent = photos.length + ' / 10';
    var skipped = e.detail.files.length - added.length;
    document.getElementById('status-msg').textContent = skipped
      ? 'Closet is full: ' + skipped + ' photo' + (skipped === 1 ? '' : 's') + ' skipped (max 10)'
      : added.length + (added.length === 1 ? ' photo' : ' photos') + ' added to your closet';
  });
</script>
