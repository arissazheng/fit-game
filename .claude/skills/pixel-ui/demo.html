<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel UI Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pixel-ui.css">
<script src="pixel-ui.js" defer></script>
<style>
  .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 28%) minmax(0, 1fr); gap: 12px; }
  .left { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; }
  .stage-win { min-height: 0; }
  .stage-win > .px-window__body { flex: 1; min-height: 0; }
  .stage { flex: 1; min-height: 240px; }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .px-slot .item { font-size: 32px; line-height: 1; } /* placeholder sprites until real pixel items exist */
  .stars .px-btn { min-width: 48px; font-size: 22px; }
  .mascot { position: absolute; right: 16px; bottom: 16px; z-index: 1; }
  @media (max-width: 860px) {
    .cols { grid-template-columns: minmax(0, 1fr); }
    .mascot { position: static; margin-top: 12px; }
    .mascot::after { display: none; }
  }
</style>
</head>
<body>
<div class="px-desktop">
  <div class="px-desktop__icons">
      <button class="px-icon"><span style="font-size:36px">📄</span><span>readme</span></button>
      <button class="px-icon" aria-selected="true"><span style="font-size:36px">👗</span><span>Closet</span></button>
      <button class="px-icon"><span style="font-size:36px">🛍️</span><span>Market</span></button>
  </div>

    <div class="px-window px-window--main">
      <div class="px-titlebar">
        <span>FASHION IN PIXELS v1.0</span>
        <span class="px-titlebar__controls"><button aria-label="Minimize">_</button><button aria-label="Maximize">□</button><button aria-label="Close">×</button></span>
      </div>
      <nav class="px-menubar"><button>File(F)</button><button>Edit(E)</button><button>View(V)</button><button>Help(H)</button></nav>

      <div class="px-window__body cols">
        <div class="left">
          <div class="px-window">
            <div class="px-titlebar"><span>Closet.exe</span><span class="px-titlebar__controls"><button>_</button><button>□</button><button>×</button></span></div>
            <div class="px-window__body">
              <div>
                <div class="px-tabs" role="tablist" aria-label="Closet categories">
                  <button class="px-tab" role="tab" id="tab-tops" aria-controls="panel-tops" aria-selected="true">Tops</button>
                  <button class="px-tab" role="tab" id="tab-bottoms" aria-controls="panel-bottoms">Bottoms</button>
                  <button class="px-tab" role="tab" id="tab-acc" aria-controls="panel-acc">Acc</button>
                </div>
                <div class="px-tabpanel" role="tabpanel" id="panel-tops" aria-labelledby="tab-tops">
                  <div class="slots">
                    <button class="px-slot" title="White tee" aria-label="White tee"><span class="item">👕</span></button>
                    <button class="px-slot" title="Pink blouse" aria-label="Pink blouse" aria-selected="true"><span class="item">👚</span></button>
                    <button class="px-slot" title="Denim jacket" aria-label="Denim jacket"><span class="item">🧥</span></button>
                    <button class="px-slot" title="Black tank top" aria-label="Black tank top"><span class="item">🎽</span></button>
                  </div>
                </div>
                <div class="px-tabpanel" role="tabpanel" id="panel-bottoms" aria-labelledby="tab-bottoms" hidden>
                  <div class="slots">
                    <button class="px-slot" title="Baggy jeans" aria-label="Baggy jeans"><span class="item">👖</span></button>
                    <button class="px-slot" title="Black shorts" aria-label="Black shorts"><span class="item">🩳</span></button>
                    <button class="px-slot" title="Slip dress" aria-label="Slip dress"><span class="item">👗</span></button>
                  </div>
                </div>
                <div class="px-tabpanel" role="tabpanel" id="panel-acc" aria-labelledby="tab-acc" hidden>
                  <div class="slots">
                    <button class="px-slot" title="Shoulder bag" aria-label="Shoulder bag"><span class="item">👜</span></button>
                    <button class="px-slot" title="Sunglasses" aria-label="Sunglasses"><span class="item">🕶️</span></button>
                    <button class="px-slot" title="Cap" aria-label="Cap"><span class="item">🧢</span></button>
                    <button class="px-slot" title="Ring" aria-label="Ring"><span class="item">💍</span></button>
                    <button class="px-slot" title="Hair bow" aria-label="Hair bow"><span class="item">🎀</span></button>
                  </div>
                </div>
              </div>
              <span class="px-label">Colorway</span>
              <div class="px-btn-grid">
                <button class="px-btn px-swatch" aria-pressed="true"><span class="px-swatch__colors"><i style="background:#f6c1d1"></i><i style="background:#e0708e"></i><i style="background:#b8345b"></i><i style="background:#fff"></i></span>Sakura</button>
                <button class="px-btn px-swatch"><span class="px-swatch__colors"><i style="background:#0f380f"></i><i style="background:#306230"></i><i style="background:#8bac0f"></i><i style="background:#9bbc0f"></i></span>Game Boy</button>
              </div>
            </div>
          </div>

          <div class="px-window is-inactive">
            <div class="px-titlebar"><span>Settings</span><span class="px-titlebar__controls"><button>_</button><button>□</button><button>×</button></span></div>
            <div class="px-window__body">
              <label class="px-check"><input type="checkbox" checked> SOUND ON / OFF</label>
              <input class="px-input" placeholder="you@email.com">
            </div>
          </div>
        </div>

        <div class="px-window stage-win">
          <div class="px-titlebar"><span>THEME: Y2K Pop Star</span><span class="px-titlebar__controls"><button>_</button><button>□</button><button>×</button></span></div>
          <div class="px-window__body">
            <div class="px-progress" style="--value:.65"><i></i></div>
            <div class="px-well px-dropzone stage" id="upload-zone" aria-label="Upload outfit photos">
              <input type="file" id="upload-input" accept="image/*" multiple>
              <div class="px-well__empty">🖼<br>Drag &amp; Drop<br>or Click</div>
              <div class="px-bubble mascot">Want to dress up? I'm great at waiting.</div>
            </div>
            <div class="px-btn-row stars">
              <button class="px-btn" aria-pressed="true">★</button><button class="px-btn" aria-pressed="true">★</button><button class="px-btn" aria-pressed="true">★</button><button class="px-btn">★</button><button class="px-btn">★</button>
            </div>
            <button class="px-btn px-btn--wide">↓ Lock in outfit</button>
          </div>
        </div>
      </div>

      <div class="px-statusbar"><span id="status-msg">Ready</span><span>0:39</span><span>120 coins</span></div>
    </div>

</div>

<div class="px-taskbar">
  <button class="px-btn">▤ Start</button>
  <button class="px-btn px-taskbar__task">📄 readme</button>
  <button class="px-btn px-taskbar__task" aria-pressed="true">👗 Closet.exe</button>
  <span class="px-taskbar__tray">🔈 17:13</span>
</div>
<script>
  document.getElementById('upload-zone').addEventListener('px-files', function (e) {
    var n = e.detail.files.length;
    document.getElementById('status-msg').textContent = n + (n === 1 ? ' photo' : ' photos') + ' imported: ' + e.detail.files[0].name;
  });
</script>
</body>
</html>
